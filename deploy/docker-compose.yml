# UNTESTED EXAMPLE — never built or run in the development environment.
# Usage (from the repository root):
#   cp .env.example .env     # set APP_SECRET, APP_URL, email settings; leave DATABASE_URL, the compose file overrides it
#   docker compose -f deploy/docker-compose.yml up -d db
#   docker compose -f deploy/docker-compose.yml run --rm app npx prisma migrate deploy
#   docker compose -f deploy/docker-compose.yml run --rm -e SEED_ADMIN_EMAIL=you@example.com -e SEED_ADMIN_PASSWORD='long-password-1' app npm run db:seed
#   docker compose -f deploy/docker-compose.yml up -d
# Put a TLS-terminating reverse proxy (Caddy, nginx, a cloud load balancer) in front of port 3000.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: reset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: reset
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reset"]
      interval: 10s
      retries: 5

  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://reset:${POSTGRES_PASSWORD}@db:5432/reset?schema=public
      STORAGE_DIR: /data/storage
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - storage:/data/storage
    ports:
      - "3000:3000"

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://reset:${POSTGRES_PASSWORD}@db:5432/reset?schema=public
      STORAGE_DIR: /data/storage
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - storage:/data/storage

volumes:
  dbdata:
  storage:
